<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바벨탑 — 송출</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:'Noto Sans KR',sans-serif; background:#0a0500; color:white;
               overflow:hidden; width:100vw; height:100vh; }

        /* ── 배경 ── */
        #bg { position:fixed; inset:0; z-index:0; transition:background 4s ease; }

        /* 번개 (90층 이상) */
        #lightning {
            position:fixed; inset:0; z-index:1; pointer-events:none;
            display:none;
        }
        #lightning.active { display:block; animation:lightningFlash 3s ease-in-out infinite; }
        @keyframes lightningFlash {
            0%,94%,96%,100%{ opacity:0; }
            95%{ opacity:0.6; background:rgba(200,180,255,0.15); }
        }

        /* ── 레이아웃 ── */
        #root { position:relative; z-index:2; display:grid;
                grid-template-columns:1fr 100px 1fr; height:100vh; }

        /* ── 팀 패널 ── */
        .team-panel { display:flex; flex-direction:column; overflow:hidden; padding:0 0.8rem; }

        /* 팀 헤더 */
        .team-header { padding:1rem 0.5rem 0.5rem; flex-shrink:0; display:flex;
                       align-items:flex-end; justify-content:space-between; }
        .team-name  { font-size:1.8rem; font-weight:900; }
        .team-floor { font-size:4.5rem; font-weight:900; line-height:1;
                      font-variant-numeric:tabular-nums; }

        /* 진행 바 */
        .prog-wrap { height:6px; background:rgba(255,255,255,0.08);
                     border-radius:3px; margin:0 0.5rem 0.6rem; overflow:hidden; flex-shrink:0; }
        .prog-bar { height:100%; border-radius:3px; transition:width 0.4s ease; min-width:2px; }

        /* 타워 영역 */
        .tower-wrap {
            flex:1; position:relative; overflow:hidden;
            margin:0 0.5rem;
        }

        /* 지면 */
        .ground {
            position:absolute; bottom:0; left:0; right:0;
            height:8px; border-radius:3px;
        }

        /* 벽돌 컨테이너 — 아래에서 위로 쌓임 */
        .bricks {
            position:absolute; bottom:12px; left:0; right:0;
            display:flex; flex-direction:column-reverse;
            gap:2px;
        }

        /* 벽돌 */
        .brick {
            height:0; /* JS로 설정 */ border-radius:3px;
            position:relative; overflow:hidden;
            box-shadow:0 2px 6px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15);
        }
        .brick.add {
            animation:brickAdd 0.35s cubic-bezier(0.22,0.61,0.36,1) forwards;
        }
        .brick.remove {
            animation:brickRemove 0.4s ease-in forwards;
        }
        @keyframes brickAdd {
            from { transform:scaleY(0) translateY(-10px); opacity:0; }
            to   { transform:scaleY(1) translateY(0);     opacity:1; }
        }
        @keyframes brickRemove {
            0%   { transform:translateY(0)    scaleX(1);   opacity:1; }
            40%  { transform:translateY(-8px) scaleX(1.1); opacity:0.7; }
            100% { transform:translateY(40px) scaleX(0.6); opacity:0; }
        }

        /* 충돌 흔들림 (타임아웃) */
        .tower-wrap.shake {
            animation:towerShake 0.5s ease;
        }
        @keyframes towerShake {
            0%,100%{ transform:translateX(0); }
            20%    { transform:translateX(-8px); }
            40%    { transform:translateX(8px); }
            60%    { transform:translateX(-5px); }
            80%    { transform:translateX(5px); }
        }

        /* 층 완성 폭발 효과 */
        .burst {
            position:absolute; inset:0; pointer-events:none;
            background:radial-gradient(circle at center, currentColor 0%, transparent 70%);
            opacity:0;
        }
        .burst.pop { animation:burstPop 0.5s ease; }
        @keyframes burstPop {
            0%  { opacity:0.5; transform:scale(0.2); }
            60% { opacity:0.2; transform:scale(1.1); }
            100%{ opacity:0;   transform:scale(1.5); }
        }

        /* ── 중앙 ── */
        #center {
            display:flex; flex-direction:column; align-items:center;
            justify-content:space-between; padding:1rem 0;
        }
        .center-title { font-size:1rem; font-weight:900; color:#f59e0b;
            text-shadow:0 0 20px rgba(245,158,11,0.5); }
        .vs-badge { font-size:1.8rem; font-weight:900; color:#44403c; }
        .floor-goal { font-size:0.75rem; color:#44403c; text-align:center; }
        .center-line { flex:1; width:1px; background:#1c1917; }

        /* ── 혼잡 오버레이 ── */
        #confusion-overlay {
            position:fixed; inset:0; z-index:10; pointer-events:none;
            display:none; align-items:center; justify-content:center;
        }
        #confusion-overlay.active { display:flex; }
        .confusion-bg {
            position:absolute; inset:0;
            background:rgba(120,0,0,0.12);
            animation:confBg 2s ease-in-out infinite;
        }
        @keyframes confBg { 0%,100%{opacity:0.6} 50%{opacity:1} }
        .confusion-text-big {
            position:relative; font-size:7vw; font-weight:900;
            color:rgba(239,68,68,0.12); text-align:center; line-height:1.3;
            pointer-events:none;
            animation:confTxt 4s ease-in-out infinite;
        }
        @keyframes confTxt { 0%,100%{opacity:0.08} 50%{opacity:0.18} }

        /* 혼잡 상단 배너 */
        #confusion-banner {
            position:fixed; top:0; left:0; right:0; z-index:20;
            padding:0.5rem; text-align:center; font-size:1rem; font-weight:900;
            display:none; backdrop-filter:blur(4px);
        }
        #confusion-banner.level1 { display:block; background:rgba(120,40,0,0.85); color:#fcd34d;
            animation:bannerBlink 2.5s ease-in-out infinite; }
        #confusion-banner.level2 { display:block; background:rgba(153,0,0,0.9); color:#fef2f2;
            animation:bannerBlink 0.9s ease-in-out infinite; }
        @keyframes bannerBlink { 0%,100%{opacity:1} 50%{opacity:0.7} }

        /* ── 로비 오버레이 ── */
        #lobby-overlay {
            position:fixed; inset:0; z-index:30; background:rgba(10,5,0,0.93);
            backdrop-filter:blur(6px);
            display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1rem;
        }
        #lobby-overlay.hidden { display:none; }
        .lobby-logo-big { font-size:6rem; font-weight:900; color:#f59e0b;
            text-shadow:0 0 60px rgba(245,158,11,0.5); }
        .lobby-title { font-size:2.5rem; font-weight:900; color:#f59e0b; }
        .lobby-sub   { font-size:1.1rem; color:#78350f; }
        #lobby-counts { font-size:1.3rem; font-weight:700; color:#44403c; margin-top:0.3rem; }

        /* ── 승리 오버레이 ── */
        #win-overlay {
            position:fixed; inset:0; z-index:40; background:rgba(0,0,0,0.88);
            display:none; flex-direction:column;
            align-items:center; justify-content:center; gap:1.5rem;
        }
        #win-overlay.show { display:flex; animation:winIn 1s ease; }
        @keyframes winIn { from{opacity:0;transform:scale(0.9)} to{opacity:1;transform:scale(1)} }
        .win-icon  { font-size:6rem; }
        .win-title { font-size:4.5rem; font-weight:900; text-align:center; }
        .win-verse {
            padding:1.2rem 2rem; border:1px solid rgba(245,158,11,0.3);
            border-radius:1rem; background:rgba(245,158,11,0.08);
            font-size:1.1rem; color:#fde68a; text-align:center; line-height:1.7; max-width:600px;
        }
    </style>
</head>
<body>

<div id="bg"></div>
<div id="lightning"></div>

<!-- 메인 -->
<div id="root">

    <!-- 팀 A -->
    <div class="team-panel" id="panel-a">
        <div class="team-header" style="background:transparent;">
            <div class="team-name"  style="color:#93c5fd;">🔵 팀 A</div>
            <div class="team-floor" style="color:#93c5fd;" id="floor-num-a">0</div>
        </div>
        <div class="prog-wrap">
            <div class="prog-bar" id="prog-a" style="background:#3b82f6;width:1%;"></div>
        </div>
        <div class="tower-wrap" id="wrap-a">
            <div class="bricks" id="bricks-a"></div>
            <div class="ground" style="background:#1d4ed8;"></div>
            <div class="burst" id="burst-a" style="color:#3b82f6;"></div>
        </div>
    </div>

    <!-- 중앙 -->
    <div id="center">
        <div class="center-title">🏗️<br>바벨탑</div>
        <div class="center-line"></div>
        <div class="vs-badge">VS</div>
        <div class="center-line"></div>
        <div class="floor-goal">목표<br>100층</div>
    </div>

    <!-- 팀 B -->
    <div class="team-panel" id="panel-b">
        <div class="team-header" style="background:transparent; flex-direction:row-reverse;">
            <div class="team-name"  style="color:#fca5a5;">🔴 팀 B</div>
            <div class="team-floor" style="color:#fca5a5;" id="floor-num-b">0</div>
        </div>
        <div class="prog-wrap">
            <div class="prog-bar" id="prog-b" style="background:#ef4444;width:1%;"></div>
        </div>
        <div class="tower-wrap" id="wrap-b">
            <div class="bricks" id="bricks-b"></div>
            <div class="ground" style="background:#991b1b;"></div>
            <div class="burst" id="burst-b" style="color:#ef4444;"></div>
        </div>
    </div>
</div>

<!-- 혼잡 배너 -->
<div id="confusion-banner"></div>

<!-- 혼잡 배경 효과 -->
<div id="confusion-overlay">
    <div class="confusion-bg"></div>
    <div class="confusion-text-big">
        אבגדהוזחטי<br>ᚠᚡᚢᚣᚤᚥᚦᛒᛗᛚᛏ<br>𒀭𒀮𒈙𒈚𒈛𒈜𒈝
    </div>
</div>

<!-- 로비 -->
<div id="lobby-overlay">
    <div class="lobby-logo-big">🏗️</div>
    <div class="lobby-title">바벨탑</div>
    <div class="lobby-sub">언어의 혼잡 — 선생님이 시작하면 게임이 시작됩니다</div>
    <div id="lobby-counts">🔵 팀A: 0명 | 🔴 팀B: 0명</div>
</div>

<!-- 승리 -->
<div id="win-overlay">
    <div class="win-icon">🏗️</div>
    <div class="win-title" id="win-title"></div>
    <div class="win-verse">
        "여호와께서 거기서 그들의 언어를 혼잡하게 하셨으므로<br>
        그들이 온 지면에 흩어졌더라"<br>
        <span style="font-size:0.9rem;color:#a78bfa;">— 창세기 11:8~9</span>
    </div>
</div>

<script type="module">
import { initializeApp }  from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import {
    getFirestore, doc, onSnapshot, collection
} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const FB = initializeApp({
    apiKey:"AIzaSyCfyjgtiDVD4Wsd9iGb9tEdrOGFYxxN2Tw",
    authDomain:"kingdomgenius.firebaseapp.com",
    projectId:"kingdomgenius",
    storageBucket:"kingdomgenius.firebasestorage.app",
    messagingSenderId:"385557748196",
    appId:"1:385557748196:web:457b999a38e4982f188ff1"
});
const auth = getAuth(FB);
const db   = getFirestore(FB);

const STATE_REF = doc(db,'kingdom_genius_games','babel_room','data','state');
const TEAM_REF  = t => doc(db,'kingdom_genius_games','babel_room','teams',t);
const PLAYERS   = collection(db,'kingdom_genius_games','babel_room','players');

// ── 색깔 ─────────────────────────────────────────────
const COLORS = {
    red:    '#ef4444', orange:'#f97316', yellow:'#eab308',
    green:  '#22c55e', blue:  '#3b82f6', indigo:'#6366f1', violet:'#a855f7',
};
const MAX_FLOOR = 100;

// ── 상태 ─────────────────────────────────────────────
const state = {
    A: { floor:0, completedColors:[], prevColors:[] },
    B: { floor:0, completedColors:[], prevColors:[] },
};

// ── 배경 업데이트 ─────────────────────────────────────
function updateBg(maxFloor) {
    const bg = document.getElementById('bg');
    const gradients = [
        [0,  'linear-gradient(to top,#1a0a00,#0a0500)'],
        [20, 'linear-gradient(to top,#0c1830,#100800)'],
        [40, 'linear-gradient(to top,#071828,#0c1830)'],
        [60, 'linear-gradient(to top,#040c20,#071828)'],
        [80, 'linear-gradient(to top,#000008,#040c20)'],
        [90, 'linear-gradient(to top,#0a0010,#000008)'],
    ];
    let chosen = gradients[0][1];
    for (const [threshold, g] of gradients) {
        if (maxFloor >= threshold) chosen = g;
    }
    bg.style.background = chosen;

    // 번개 (90층+)
    document.getElementById('lightning').classList.toggle('active', maxFloor >= 90);
}

// ── 벽돌 높이 계산 ────────────────────────────────────
function getBrickH(team) {
    // 타워 가시 높이에서 벽돌 수에 따라 크기 결정
    const wrap = document.getElementById(`wrap-${team.toLowerCase()}`);
    const totalH = wrap.clientHeight - 20; // ground 포함
    const count = state[team].completedColors.length;
    if (!count) return 0;
    // 최대 30개 표시, 그 이상은 스크롤 없이 축소
    const visible = Math.min(count, 30);
    return Math.max(6, Math.floor((totalH - visible * 2) / visible));
}

// ── 탑 완전 재렌더링 ──────────────────────────────────
function rerenderTower(team, animateLast, animateType) {
    const bricksEl = document.getElementById(`bricks-${team.toLowerCase()}`);
    const colors = state[team].completedColors;

    // 표시할 벽돌 (최근 30개, 아래가 오래된 것)
    const visible = colors.slice(-30);
    const brickH = Math.max(6, Math.floor(
        (document.getElementById(`wrap-${team.toLowerCase()}`).clientHeight - 20 - visible.length * 2) /
        Math.max(1, visible.length)
    ));

    bricksEl.innerHTML = '';
    visible.forEach((colorId, i) => {
        const hex = COLORS[colorId] || '#888';
        const div = document.createElement('div');
        div.className = 'brick';
        div.style.height = brickH + 'px';
        div.style.background = hex;
        // 마지막 벽돌에 애니메이션
        if (i === visible.length - 1 && animateLast) {
            div.classList.add(animateType);
            div.addEventListener('animationend', () => div.classList.remove(animateType), {once:true});
        }
        bricksEl.appendChild(div);
    });

    // 진행 바
    const pct = Math.max(1, (colors.length / MAX_FLOOR) * 100);
    document.getElementById(`prog-${team.toLowerCase()}`).style.width = pct + '%';

    // 층 숫자
    document.getElementById(`floor-num-${team.toLowerCase()}`).textContent = state[team].floor + '층';
}

// ── 층 추가 (성공) ────────────────────────────────────
function addFloor(team, newColors) {
    state[team].completedColors = newColors;
    rerenderTower(team, true, 'add');

    // 색깔 폭발 효과
    const lastColor = newColors[newColors.length - 1];
    const hex = COLORS[lastColor] || '#ffffff';
    const burst = document.getElementById(`burst-${team.toLowerCase()}`);
    burst.style.color = hex;
    burst.classList.remove('pop');
    void burst.offsetWidth; // reflow
    burst.classList.add('pop');
    burst.addEventListener('animationend', () => burst.classList.remove('pop'), {once:true});
}

// ── 층 제거 (실패) ────────────────────────────────────
function removeFloor(team, newColors) {
    // 흔들림 효과
    const wrap = document.getElementById(`wrap-${team.toLowerCase()}`);
    wrap.classList.remove('shake');
    void wrap.offsetWidth;
    wrap.classList.add('shake');
    wrap.addEventListener('animationend', () => wrap.classList.remove('shake'), {once:true});

    // 살짝 딜레이 후 재렌더
    setTimeout(() => {
        state[team].completedColors = newColors;
        rerenderTower(team, false, 'remove');
    }, 200);
}

// ── 팀 상태 업데이트 ─────────────────────────────────
function updateTeam(team, data) {
    const prev = state[team];
    const newFloor = data.floor || 0;
    const newColors = data.completedColors || [];

    // 층수 변화 감지
    const floorDiff = newFloor - prev.floor;

    if (floorDiff > 0) {
        // 층 올라감 (성공)
        addFloor(team, newColors);
    } else if (floorDiff < 0) {
        // 층 내려감 (실패)
        removeFloor(team, newColors);
    } else if (newColors.length !== prev.completedColors.length) {
        // 같은 층수지만 색깔 변경 (초기화 등)
        state[team].completedColors = newColors;
        rerenderTower(team, false, 'add');
    }

    state[team].floor = newFloor;
    document.getElementById(`floor-num-${team.toLowerCase()}`).textContent = newFloor + '층';
    document.getElementById(`prog-${team.toLowerCase()}`).style.width =
        Math.max(1, (newFloor / MAX_FLOOR) * 100) + '%';

    // 배경
    const otherFloor = state[team === 'A' ? 'B' : 'A'].floor;
    updateBg(Math.max(newFloor, otherFloor));
}

// ── 혼잡 UI ──────────────────────────────────────────
function updateConfusion(level) {
    const banner  = document.getElementById('confusion-banner');
    const overlay = document.getElementById('confusion-overlay');
    banner.className = '';
    if (level === 1) {
        banner.className = 'level1';
        banner.textContent = '⚠ 언어의 혼잡 1단계 — 채팅이 이상해지고 있습니다...';
        overlay.classList.remove('active');
    } else if (level === 2) {
        banner.className = 'level2';
        banner.textContent = '🔥 완전한 언어의 혼잡! — אבג ᚠᚡᚢ 𒀭𒀮 말이 통하지 않습니다!';
        overlay.classList.add('active');
    } else {
        banner.textContent = '';
        overlay.classList.remove('active');
    }
}

// ── Firebase ─────────────────────────────────────────
function setupListeners() {
    onSnapshot(STATE_REF, snap => {
        if (!snap.exists()) return;
        const d = snap.data();
        const ns = d.gameStatus || 'lobby';

        updateConfusion(d.confusionLevel || 0);

        document.getElementById('lobby-overlay').classList.toggle('hidden', ns === 'playing');

        if (d.winner) {
            const name = d.winner === 'A' ? '🔵 팀 A' : '🔴 팀 B';
            const col  = d.winner === 'A' ? '#93c5fd' : '#fca5a5';
            const winEl = document.getElementById('win-title');
            winEl.textContent = `${name} 100층 달성! 🏆`;
            winEl.style.color = col;
            document.getElementById('win-overlay').classList.add('show');
        } else {
            document.getElementById('win-overlay').classList.remove('show');
        }
    });

    onSnapshot(TEAM_REF('A'), snap => { if (snap.exists()) updateTeam('A', snap.data()); });
    onSnapshot(TEAM_REF('B'), snap => { if (snap.exists()) updateTeam('B', snap.data()); });

    onSnapshot(PLAYERS, snap => {
        const count = {A:0, B:0};
        snap.forEach(d => { const t = d.data().team; if (t) count[t]++; });
        document.getElementById('lobby-counts').textContent =
            `🔵 팀A: ${count.A}명 | 🔴 팀B: ${count.B}명`;
    });
}

try { await signInAnonymously(auth); setupListeners(); } catch(e) { console.error(e); }
</script>
</body>
</html>
