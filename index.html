<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>바벨탑: 언어의 혼잡</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:'Noto Sans KR',sans-serif; background:#1a0a00; color:white;
               overflow:hidden; width:100vw; height:100vh; touch-action:none; user-select:none; }
        .screen { position:fixed; inset:0; display:flex; flex-direction:column;
                  align-items:center; justify-content:center; gap:1rem; padding:1.5rem; }
        .screen.hidden { display:none; }

        /* ── 입장 화면 ── */
        #entry-screen { background:linear-gradient(160deg,#1a0a00 0%,#2d1a00 100%); z-index:100; }
        .logo { font-size:4.5rem; font-weight:900; color:#f59e0b;
            text-shadow:0 0 40px rgba(245,158,11,0.7); letter-spacing:-2px; line-height:1; }
        .logo-sub { font-size:1.1rem; color:#78350f; font-weight:700; margin-top:-0.3rem; }
        #name-input {
            width:100%; max-width:300px; padding:0.9rem 1.2rem; font-size:1.3rem;
            font-family:'Noto Sans KR',sans-serif; background:#292524;
            border:2px solid #44403c; border-radius:0.9rem; color:white; text-align:center; outline:none;
        }
        #name-input:focus { border-color:#f59e0b; }
        .team-row { display:grid; grid-template-columns:1fr 1fr; gap:0.8rem; width:100%; max-width:300px; }
        .team-btn {
            padding:0.8rem; font-size:1rem; font-weight:900;
            font-family:'Noto Sans KR',sans-serif;
            border:2px solid #44403c; border-radius:0.9rem; cursor:pointer;
            background:#292524; color:#a8a29e; transition:all 0.15s;
        }
        .team-btn.selected-A { background:#1e3a5f; color:#93c5fd; border-color:#3b82f6; }
        .team-btn.selected-B { background:#3b1515; color:#fca5a5; border-color:#ef4444; }
        .team-btn:active { transform:scale(0.97); }
        #join-btn {
            width:100%; max-width:300px; padding:1rem; font-size:1.1rem; font-weight:900;
            font-family:'Noto Sans KR',sans-serif;
            background:linear-gradient(135deg,#d97706,#b45309);
            color:white; border:none; border-radius:0.9rem; cursor:pointer;
        }
        #join-btn:active { transform:scale(0.97); }
        #gm-gear-btn { background:none; border:none; cursor:pointer; color:#292524;
            font-size:1.4rem; transition:color 0.2s,transform 0.3s; padding:0.3rem; }
        #gm-gear-btn:hover { color:#44403c; transform:rotate(60deg); }

        /* ── 비번 모달 ── */
        #pw-modal { position:fixed; inset:0; background:rgba(0,0,0,0.9);
            display:none; align-items:center; justify-content:center; z-index:300; }
        #pw-modal.visible { display:flex; }
        .pw-box { background:#292524; border:1px solid #44403c; border-radius:1.5rem;
            padding:2rem 1.8rem; width:280px; display:flex; flex-direction:column; gap:1rem; align-items:center; }
        .pw-title { font-size:1rem; font-weight:700; color:#a8a29e; }
        #pw-input { width:100%; padding:0.8rem; font-size:1.8rem; font-family:'Noto Sans KR',sans-serif;
            background:#1c1917; border:2px solid #44403c; border-radius:0.8rem; color:white;
            text-align:center; outline:none; letter-spacing:0.4em; }
        #pw-input:focus { border-color:#f59e0b; }
        .pw-btns { display:grid; grid-template-columns:1fr 1fr; gap:0.6rem; width:100%; }
        .pw-confirm { padding:0.7rem; font-size:1rem; font-weight:900;
            font-family:'Noto Sans KR',sans-serif; background:#d97706;
            color:white; border:none; border-radius:0.6rem; cursor:pointer; }
        .pw-cancel { padding:0.7rem; font-size:1rem; font-weight:700;
            font-family:'Noto Sans KR',sans-serif; background:#292524;
            color:#64748b; border:1px solid #44403c; border-radius:0.6rem; cursor:pointer; }
        #pw-error { font-size:0.8rem; color:#ef4444; min-height:0.9rem; }

        /* ── GM 화면 ── */
        #gm-screen { background:#0c0a09; z-index:200; justify-content:flex-start; padding:0; overflow-y:auto; align-items:stretch; }
        .gm-header { padding:1rem 1.5rem; background:#1c1917; border-bottom:1px solid #292524;
            display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
        .gm-header-title { font-size:1.3rem; font-weight:900; color:#f59e0b; }
        .gm-body { padding:1.2rem; display:flex; flex-direction:column; gap:1.2rem; }
        .section-label { font-size:0.7rem; font-weight:700; color:#57534e;
            letter-spacing:0.1em; text-transform:uppercase; border-bottom:1px solid #292524; padding-bottom:0.4rem; }
        .team-stat-row { display:grid; grid-template-columns:1fr 1fr; gap:0.8rem; }
        .team-stat-card { background:#292524; border-radius:0.8rem; padding:0.8rem; }
        .team-stat-title { font-size:0.75rem; font-weight:700; margin-bottom:0.4rem; }
        .team-stat-floor { font-size:2.5rem; font-weight:900; line-height:1; }
        .team-stat-info { font-size:0.75rem; color:#78716c; margin-top:0.2rem; }
        .team-stat-color { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:4px; }

        /* 혼잡 버튼 */
        .confusion-row { display:grid; grid-template-columns:repeat(3,1fr); gap:0.5rem; }
        .conf-btn { padding:0.65rem 0; font-size:0.85rem; font-weight:900;
            font-family:'Noto Sans KR',sans-serif; border-radius:0.7rem; cursor:pointer; border:2px solid transparent; transition:all 0.15s; }
        .conf-btn:active { transform:scale(0.95); }
        #cb0 { background:#292524; color:#78716c; }
        #cb1 { background:#44263a; color:#f9a8d4; }
        #cb2 { background:#3b0f0f; color:#fca5a5; }
        .conf-btn.active { border-color:white; box-shadow:0 0 10px currentColor; }
        #big-confusion-btn {
            padding:1rem; font-size:1.1rem; font-weight:900;
            font-family:'Noto Sans KR',sans-serif;
            background:linear-gradient(135deg,#7c2d12,#991b1b);
            color:white; border:none; border-radius:0.8rem; cursor:pointer;
            box-shadow:0 0 20px rgba(239,68,68,0.4);
        }

        .action-row { display:grid; grid-template-columns:1fr 1fr; gap:0.7rem; }
        .btn-green { padding:0.9rem; font-size:1rem; font-weight:900; font-family:'Noto Sans KR',sans-serif;
            background:linear-gradient(135deg,#16a34a,#15803d); color:white; border:none; border-radius:0.8rem; cursor:pointer; }
        .btn-gray  { padding:0.9rem; font-size:1rem; font-weight:700; font-family:'Noto Sans KR',sans-serif;
            background:#292524; color:#78716c; border:1px solid #44403c; border-radius:0.8rem; cursor:pointer; }
        .btn-blue  { padding:0.9rem; font-size:1rem; font-weight:900; font-family:'Noto Sans KR',sans-serif;
            background:linear-gradient(135deg,#0ea5e9,#0284c7); color:white; border:none; border-radius:0.8rem; cursor:pointer; }
        .btn-green:active,.btn-gray:active,.btn-blue:active { transform:scale(0.97); }

        /* GM 채팅 모니터 */
        .gm-chats { display:grid; grid-template-columns:1fr 1fr; gap:0.8rem; }
        .gm-chat-box { background:#1c1917; border-radius:0.7rem; padding:0.6rem; max-height:120px; overflow-y:auto; }
        .gm-chat-title { font-size:0.7rem; font-weight:700; margin-bottom:0.3rem; }
        .gm-chat-msg { font-size:0.75rem; color:#a8a29e; padding:0.15rem 0; border-bottom:1px solid #292524; word-break:break-all; }
        .gm-chat-msg:last-child { border:none; }

        /* ── 대기실 ── */
        #lobby-screen { background:linear-gradient(160deg,#1a0a00 0%,#2d1a00 100%); z-index:90; }
        .lobby-logo { font-size:4rem; font-weight:900; color:#f59e0b; text-shadow:0 0 30px rgba(245,158,11,0.5); }
        .lobby-team-badge { padding:0.5rem 1.5rem; border-radius:2rem; font-size:1rem; font-weight:900; margin-top:0.3rem; }

        /* ── 게임 화면 공통 ── */
        #leader-screen, #member-screen {
            justify-content:flex-start; padding:0;
            overflow:hidden;
        }

        .game-header {
            width:100%; padding:0.8rem 1rem; flex-shrink:0;
            display:flex; align-items:center; justify-content:space-between;
        }
        .floor-badge { font-size:1.1rem; font-weight:900; }
        .timer-badge { font-size:2rem; font-weight:900; font-variant-numeric:tabular-nums; }
        .role-badge { font-size:0.75rem; font-weight:700; padding:0.2rem 0.7rem;
            border-radius:1rem; }

        /* 타이머 색상 */
        .timer-ok   { color:#4ade80; }
        .timer-warn { color:#fbbf24; }
        .timer-crit { color:#ef4444; animation:timerPulse 0.5s ease-in-out infinite; }
        @keyframes timerPulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

        /* ── 팀장 화면 ── */
        #leader-color-display {
            flex-shrink:0; width:100%; padding:1.2rem 1rem;
            display:flex; flex-direction:column; align-items:center; gap:0.4rem;
        }
        .current-color-box {
            width:100%; max-width:280px; height:90px;
            border-radius:1rem; display:flex; align-items:center; justify-content:center;
            font-size:2rem; font-weight:900; color:white;
            text-shadow:0 2px 8px rgba(0,0,0,0.5);
            box-shadow:0 0 30px currentColor; transition:background 0.3s;
        }
        .color-label-small { font-size:0.85rem; color:#78716c; }

        /* ── 멤버 화면 ── */
        #color-buttons {
            width:100%; padding:0.8rem 1rem; flex-shrink:0;
        }
        .color-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:0.5rem; }
        .color-btn {
            padding:0.7rem 0.3rem; border-radius:0.7rem; border:none; cursor:pointer;
            font-size:0.85rem; font-weight:900; font-family:'Noto Sans KR',sans-serif;
            color:white; text-shadow:0 1px 3px rgba(0,0,0,0.5);
            transition:transform 0.1s, opacity 0.2s;
            box-shadow:0 3px 8px rgba(0,0,0,0.4);
        }
        .color-btn:active { transform:scale(0.92); }
        .color-btn.disabled { opacity:0.3; pointer-events:none; }
        .color-btn.correct { animation:correctFlash 0.5s ease; }
        .color-btn.wrong   { animation:wrongShake 0.4s ease; }
        @keyframes correctFlash { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
        @keyframes wrongShake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

        /* ── 채팅 공통 ── */
        .chat-area {
            flex:1; width:100%; display:flex; flex-direction:column;
            overflow:hidden; border-top:1px solid #292524;
        }
        .chat-title { padding:0.5rem 1rem; font-size:0.75rem; font-weight:700; color:#57534e;
            flex-shrink:0; background:#1c1917; }
        .chat-messages { flex:1; overflow-y:auto; padding:0.5rem 1rem; display:flex; flex-direction:column; gap:0.3rem; }
        .chat-messages::-webkit-scrollbar { width:3px; }
        .chat-messages::-webkit-scrollbar-thumb { background:#44403c; border-radius:2px; }
        .chat-msg { padding:0.3rem 0.5rem; border-radius:0.5rem; font-size:0.9rem; word-break:break-all; }
        .chat-msg.from-leader { background:#1e3058; border-left:3px solid #3b82f6; }
        .chat-msg.from-me     { background:#1a2e1a; border-left:3px solid #22c55e; }
        .chat-msg.from-other  { background:#292524; }
        .chat-msg .sender-name { font-size:0.7rem; font-weight:700; color:#78716c; margin-bottom:0.1rem; }

        .chat-input-row { display:flex; gap:0.5rem; padding:0.5rem 1rem;
            background:#1c1917; border-top:1px solid #292524; flex-shrink:0; }
        #leader-chat-input, #member-chat-input {
            flex:1; padding:0.6rem 0.8rem; font-size:0.95rem;
            font-family:'Noto Sans KR',sans-serif; background:#292524;
            border:1px solid #44403c; border-radius:0.6rem; color:white; outline:none;
        }
        #leader-chat-input:focus, #member-chat-input:focus { border-color:#f59e0b; }
        .chat-send-btn { padding:0.6rem 1rem; font-size:0.9rem; font-weight:900;
            font-family:'Noto Sans KR',sans-serif; background:#d97706;
            color:white; border:none; border-radius:0.6rem; cursor:pointer; }

        /* 혼잡 경고 배너 */
        #confusion-banner {
            position:fixed; top:0; left:0; right:0; z-index:90;
            padding:0.4rem; text-align:center; font-size:0.85rem; font-weight:900;
            display:none;
        }
        #confusion-banner.level1 { background:#7c2d12; color:#fca5a5; display:block; }
        #confusion-banner.level2 { background:#991b1b; color:#fef2f2; display:block;
            animation:bannerPulse 1s ease-in-out infinite; }
        @keyframes bannerPulse { 0%,100%{opacity:1} 50%{opacity:0.7} }

        /* 층 결과 오버레이 */
        #floor-result {
            position:fixed; inset:0; z-index:150; display:none;
            align-items:center; justify-content:center;
            pointer-events:none;
        }
        #floor-result.show { display:flex; animation:resultFade 0.8s ease forwards; }
        @keyframes resultFade { 0%{opacity:1} 80%{opacity:1} 100%{opacity:0} }
        #floor-result-inner { font-size:4rem; font-weight:900; text-shadow:0 0 30px currentColor; }
        #floor-result.success #floor-result-inner { color:#4ade80; }
        #floor-result.fail    #floor-result-inner { color:#ef4444; }

        /* 승리/패배 화면 */
        #end-screen { background:radial-gradient(circle,#1a0d00,#000); z-index:250; }
        .end-title { font-size:3rem; font-weight:900; text-align:center; }
        .end-sub   { font-size:1.1rem; color:rgba(255,255,255,0.7); text-align:center; line-height:1.6; }
        .end-verse { padding:1rem 1.5rem; border:1px solid rgba(245,158,11,0.3);
            border-radius:1rem; background:rgba(245,158,11,0.07);
            font-size:0.9rem; color:#fde68a; text-align:center; line-height:1.6; }
    </style>
</head>
<body>

<!-- ① 입장 화면 -->
<div id="entry-screen" class="screen">
    <div class="logo">바벨탑</div>
    <div class="logo-sub">언어의 혼잡</div>
    <input id="name-input" type="text" placeholder="이름 입력 (최대 5자)" maxlength="5" autocomplete="off" autocorrect="off">
    <div class="team-row">
        <button class="team-btn" id="btn-team-a" onclick="selectTeam('A')">🔵 팀 A</button>
        <button class="team-btn" id="btn-team-b" onclick="selectTeam('B')">🔴 팀 B</button>
    </div>
    <button id="join-btn">입장하기</button>
    <button id="gm-gear-btn" title="GM 입장">⚙</button>
</div>

<!-- 비번 모달 -->
<div id="pw-modal">
    <div class="pw-box">
        <div class="pw-title">⚙ GM 입장</div>
        <input id="pw-input" type="password" placeholder="••••" maxlength="8" inputmode="numeric">
        <div id="pw-error"></div>
        <div class="pw-btns">
            <button class="pw-confirm" id="pw-confirm">확인</button>
            <button class="pw-cancel"  id="pw-cancel">취소</button>
        </div>
    </div>
</div>

<!-- ② GM 화면 -->
<div id="gm-screen" class="screen hidden">
    <div class="gm-header">
        <div>
            <div class="gm-header-title">⚙ GM — 바벨탑</div>
            <div style="font-size:0.75rem;color:#57534e;">언어의 혼잡 게임</div>
        </div>
        <button onclick="exitGM()" style="background:none;border:none;color:#44403c;font-size:1.4rem;cursor:pointer;">✕</button>
    </div>
    <div class="gm-body">

        <!-- 팀 현황 -->
        <div class="section-label">팀 현황</div>
        <div class="team-stat-row">
            <div class="team-stat-card" style="border-left:3px solid #3b82f6;">
                <div class="team-stat-title" style="color:#93c5fd;">🔵 팀 A</div>
                <div class="team-stat-floor" id="gm-floor-a" style="color:#93c5fd;">-</div>
                <div class="team-stat-info" id="gm-info-a">대기 중</div>
            </div>
            <div class="team-stat-card" style="border-left:3px solid #ef4444;">
                <div class="team-stat-title" style="color:#fca5a5;">🔴 팀 B</div>
                <div class="team-stat-floor" id="gm-floor-b" style="color:#fca5a5;">-</div>
                <div class="team-stat-info" id="gm-info-b">대기 중</div>
            </div>
        </div>

        <!-- 언어 혼잡 -->
        <div class="section-label">언어의 혼잡</div>
        <div class="confusion-row">
            <button class="conf-btn active" id="cb0" onclick="setConfusion(0)">정상</button>
            <button class="conf-btn" id="cb1" onclick="setConfusion(1)">⚠ 1단계</button>
            <button class="conf-btn" id="cb2" onclick="setConfusion(2)">🔥 2단계</button>
        </div>
        <button id="big-confusion-btn" onclick="setConfusion(2)">⚡ 언어의 혼잡 발동!</button>

        <!-- 게임 제어 -->
        <div class="section-label">게임 제어</div>
        <div class="action-row">
            <button class="btn-green" onclick="startGame()">▶ 게임 시작</button>
            <button class="btn-gray"  onclick="resetGame()">↺ 초기화</button>
        </div>
        <button class="btn-blue" style="width:100%;" onclick="replayGame()">🔄 다시하기</button>

        <!-- 채팅 모니터 -->
        <div class="section-label">채팅 모니터</div>
        <div class="gm-chats">
            <div class="gm-chat-box">
                <div class="gm-chat-title" style="color:#93c5fd;">🔵 팀 A</div>
                <div id="gm-chat-a"></div>
            </div>
            <div class="gm-chat-box">
                <div class="gm-chat-title" style="color:#fca5a5;">🔴 팀 B</div>
                <div id="gm-chat-b"></div>
            </div>
        </div>
    </div>
</div>

<!-- ③ 대기실 -->
<div id="lobby-screen" class="screen hidden">
    <div class="lobby-logo">🏗️</div>
    <div style="font-size:1.8rem;font-weight:900;color:#f59e0b;">바벨탑</div>
    <div class="lobby-team-badge" id="lobby-team-badge"></div>
    <div id="lobby-role" style="font-size:0.9rem;color:#78716c;"></div>
    <p style="font-size:0.85rem;color:#44403c;text-align:center;">선생님이 시작하면 자동으로 게임이 시작됩니다</p>
    <p id="lobby-count" style="font-size:0.8rem;color:#292524;"></p>
</div>

<!-- 혼잡 배너 -->
<div id="confusion-banner"></div>

<!-- 층 결과 오버레이 -->
<div id="floor-result"><div id="floor-result-inner"></div></div>

<!-- ④ 팀장 화면 -->
<div id="leader-screen" class="screen hidden">
    <div class="game-header" id="leader-header"></div>
    <div id="leader-color-display">
        <div class="color-label-small">이번 층 색깔 (채팅으로 알려주세요!)</div>
        <div class="current-color-box" id="leader-color-box">-</div>
        <div class="color-label-small" id="leader-floor-info"></div>
    </div>
    <div class="chat-area">
        <div class="chat-title" id="leader-chat-title">💬 팀 채팅 (팀장)</div>
        <div class="chat-messages" id="leader-chat-messages"></div>
        <div class="chat-input-row">
            <input id="leader-chat-input" type="text" placeholder="색깔 이름을 입력하세요..." maxlength="30" autocomplete="off">
            <button class="chat-send-btn" onclick="sendChat()">전송</button>
        </div>
    </div>
</div>

<!-- ⑤ 팀원 화면 -->
<div id="member-screen" class="screen hidden">
    <div class="game-header" id="member-header"></div>
    <div id="color-buttons">
        <div class="color-grid" id="color-grid"></div>
    </div>
    <div class="chat-area">
        <div class="chat-title" id="member-chat-title">💬 팀 채팅</div>
        <div class="chat-messages" id="member-chat-messages"></div>
        <div class="chat-input-row">
            <input id="member-chat-input" type="text" placeholder="채팅 입력..." maxlength="20" autocomplete="off">
            <button class="chat-send-btn" onclick="sendMemberChat()">전송</button>
        </div>
    </div>
</div>

<!-- ⑥ 종료 화면 -->
<div id="end-screen" class="screen hidden">
    <div id="end-title" class="end-title"></div>
    <div id="end-sub" class="end-sub"></div>
    <div class="end-verse">
        "이는 온 땅의 언어를 거기서 혼잡하게 하셨음이니라"<br>
        <span style="font-size:0.8rem;color:#a78bfa;">— 창세기 11:9</span>
    </div>
</div>

<script type="module">
import { initializeApp }   from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import {
    getFirestore, doc, setDoc, updateDoc, getDoc, onSnapshot, addDoc,
    collection, query, orderBy, limit, writeBatch, getDocs, deleteDoc,

const COLORS = [
    { id:'red',    label:'빨간색', hex:'#ef4444' },
    { id:'orange', label:'주황색', hex:'#f97316' },
    { id:'yellow', label:'노란색', hex:'#eab308' },
    { id:'green',  label:'초록색', hex:'#22c55e' },
    { id:'blue',   label:'파란색', hex:'#3b82f6' },
    { id:'indigo', label:'남색',   hex:'#6366f1' },
    { id:'violet', label:'보라색', hex:'#a855f7' },
];
const COLOR_MAP = {};
COLORS.forEach(c=>{ COLOR_MAP[c.id]=c; });
const MAX_FLOOR = 100;
const FLOOR_TIME = 15000; // 15초

// ── 혼잡 스크램블 ─────────────────────────────────────
const FOREIGN = 'אבגדהוזחטיכלמنسعغفقكلمنهويابتثجحخدذرزسشصضطظعغᚠᚡᚢᚣᚤᚥᚦᛒᛗᛚᛏᛋᛁᚻᚹᚷᚳᚱ𒀭𒀮𒈙𒈚𒈛𒈜∰∱≋≌≍≎∿∾∽∻';
function scramble(text, level) {
    if (!level) return text;
    const ratio = level === 1 ? 0.65 : 1.0;
    return [...text].map(c => {
        if (c === ' ' && level < 2) return c;
        return Math.random() < ratio
            ? FOREIGN[Math.floor(Math.random()*FOREIGN.length)] : c;
    }).join('');
}

// ── 블루프린트 생성 ───────────────────────────────────
function generateBlueprint() {
    const ids = COLORS.map(c=>c.id);
    return Array.from({length:MAX_FLOOR}, ()=> ids[Math.floor(Math.random()*ids.length)]);
}

// ── 타이머 ────────────────────────────────────────────
function startTimer(timerEnd, floor) {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(async ()=>{
        const remaining = Math.max(0, timerEnd - Date.now());
        updateTimerUI(remaining);
        if (remaining <= 0 && lastProcessedFloor !== floor) {
            lastProcessedFloor = floor;
            clearInterval(timerInterval);
            await handleTimerExpiry(floor);
        }
    }, 100);
}
function updateTimerUI(ms) {
    const sec = Math.ceil(ms/1000);
    const el1=document.getElementById('timer-leader');
    const el2=document.getElementById('timer-member');
    const cls = sec>8?'timer-ok':sec>4?'timer-warn':'timer-crit';
    [el1,el2].forEach(el=>{ if(el){ el.textContent=sec+'초'; el.className='timer-badge '+cls; } });
}
async function handleTimerExpiry(floor) {
    if (!myTeam) return;
    try {
        await runTransaction(db, async tx=>{
            const snap=await tx.get(TEAM_REF(myTeam));
            const d=snap.data();
            if (!d||d.floor!==floor||d.floorStatus!=='active') return;
            if (Date.now() < d.timerEnd - 500) return;
            const nf=Math.max(1,d.floor-1);
            tx.update(TEAM_REF(myTeam),{
                floor:nf, floorStatus:'active',
                timerEnd:Date.now()+FLOOR_TIME,
            });
        });
    } catch(_){}
    showFloorResult(false);
}

}

// ── 색깔 누르기 (팀원) ───────────────────────────────
async function pressColor(colorId) {
    if (gameStatus!=='playing'||myRole!=='member') return;
    try {
        let correct=false;
        await runTransaction(db, async tx=>{
            const snap=await tx.get(TEAM_REF(myTeam));
            const d=snap.data();
            if(!d||d.floorStatus!=='active') return;
            if(Date.now()>d.timerEnd) return;
            const req=d.blueprint[d.floor-1];
            if(colorId!==req){ return; } // 오답: 아무것도 안함 (타이머는 계속)
            correct=true;
            const nf=d.floor+1;
            const newColors=[...(d.completedColors||[]).slice(-29), colorId];
            if(nf>MAX_FLOOR){
                tx.update(TEAM_REF(myTeam),{floorStatus:'won', completedColors:newColors});
            } else {
                tx.update(TEAM_REF(myTeam),{
                    floor:nf, floorStatus:'active',
                    timerEnd:Date.now()+FLOOR_TIME,
                    completedColors:newColors
                });
            }
        });
        if(correct) showFloorResult(true);
        else {
            // 오답 피드백
            const btn=document.querySelector(`.color-btn[data-cid="${colorId}"]`);
            if(btn){ btn.classList.add('wrong'); setTimeout(()=>btn.classList.remove('wrong'),400); }
        }
    } catch(_){}
}

// ── Firestore 리스너 ─────────────────────────────────
function setupListeners() {
    if(listenersSetup) return; listenersSetup=true;

    // 게임 상태
    onSnapshot(STATE_REF, snap=>{
        if(!snap.exists()) return;
        const d=snap.data();
        const ns=d.gameStatus||'lobby', nl=d.confusionLevel||0;
        confusionLevel=nl;
        updateConfusionBanner(nl);
        updateGMConfusionUI(nl);

        if(ns==='reset'){
            if(!isGM){ myTeam=null; myRole=null; hasJoined=false; listenersSetup=false;
                document.getElementById('name-input').value=''; showScreen('entry-screen'); }
        } else if(ns==='playing'&&gameStatus!=='playing'&&!isGM){
            if(myRole==='leader') showScreen('leader-screen');
            else if(myRole==='member') showScreen('member-screen');
        } else if(ns==='lobby'&&gameStatus==='playing'&&!isGM){
            showScreen('lobby-screen');
        } else if(d.winner&&!isGM){
            showEndScreen(d.winner);
        }
        gameStatus=ns;
    });

    // 내 팀 상태
    if(myTeam){
        onSnapshot(TEAM_REF(myTeam), snap=>{
            if(!snap.exists()) return;
            const d=snap.data();
            myTeamData=d;

            renderGameHeader(d.floor, myRole==='leader');

            if(myRole==='leader') updateLeaderColorUI(d.floor, d.blueprint);

            if(d.floorStatus==='active'&&d.timerEnd>0){
                startTimer(d.timerEnd, d.floor);
            }
            if(d.floorStatus==='won') {
                // 승리 처리는 GM 쪽에서
            }

            // GM 현황 업데이트
            if(isGM) updateGMTeamCard(myTeam,d);
        });

        // 상대 팀 현황 (GM용)
        const otherTeam=myTeam==='A'?'B':'A';
        onSnapshot(TEAM_REF(otherTeam), snap=>{
            if(snap.exists()&&isGM) updateGMTeamCard(otherTeam,snap.data());
        });

        // 채팅
        const chatQ=query(CHAT_COL(myTeam),orderBy('ts','asc'),limit(30));
        onSnapshot(chatQ, snap=>{
            const msgs=snap.docs.map(d=>d.data());
            renderChat(msgs,'leader-chat-messages', true);
            renderChat(msgs,'member-chat-messages', false);
            if(isGM) renderGMChat(myTeam, msgs);
        });
    }

    // GM 전용 리스너
    if(isGM){
        ['A','B'].forEach(t=>{
            onSnapshot(TEAM_REF(t), snap=>{
                if(snap.exists()) updateGMTeamCard(t,snap.data());
                // 승리 감지
                if(snap.exists()&&snap.data().floorStatus==='won'){
                    setDoc(STATE_REF,{gameStatus:'ended',winner:t,confusionLevel},{merge:true});
                }
            });
            const chatQ=query(CHAT_COL(t),orderBy('ts','asc'),limit(20));
            onSnapshot(chatQ, snap=>{
                renderGMChat(t, snap.docs.map(d=>d.data()));
            });
        });
        onSnapshot(PLAYERS, snap=>{
            const count={A:0,B:0};
            snap.forEach(d=>{ const t=d.data().team; if(t) count[t]++; });
            document.getElementById('lobby-count').textContent=`A: ${count.A}명 / B: ${count.B}명`;
        });
    }
}

function updateGMTeamCard(team, d) {
    const floor=d.floor||'-';
    const leader=d.leaderName||'없음';
    const colorId=d.blueprint&&d.floor?d.blueprint[d.floor-1]:null;
    const c=colorId?COLOR_MAP[colorId]:null;
    document.getElementById(`gm-floor-${team.toLowerCase()}`).textContent=floor+'층';
    document.getElementById(`gm-info-${team.toLowerCase()}`).innerHTML=
        `팀장: ${leader} · ${d.memberCount||0}명`+
        (c?` · <span class="team-stat-color" style="background:${c.hex}"></span>${c.label}`:'');
}
function renderGMChat(team, msgs) {
    const el=document.getElementById(`gm-chat-${team.toLowerCase()}`);
    el.innerHTML=msgs.slice(-6).map(m=>`<div class="gm-chat-msg"><b>${m.sender}:</b> ${m.text}</div>`).join('');
    el.scrollTop=el.scrollHeight;
}
function updateGMConfusionUI(level) {
    [0,1,2].forEach(i=>{
        const btn=document.getElementById(`cb${i}`);
        if(btn) btn.classList.toggle('active',i===level);
    });
}

window.startGame = async function() {
    const bpA=generateBlueprint(), bpB=generateBlueprint();
    const now=Date.now();
    await setDoc(TEAM_REF('A'),{ floor:1, blueprint:bpA,
        timerEnd:now+FLOOR_TIME, floorStatus:'active', completedColors:[],
        leaderUid:''/*preserved*/, leaderName:'', memberCount:0 },{merge:true});
    await setDoc(TEAM_REF('B'),{ floor:1, blueprint:bpB,
        timerEnd:now+FLOOR_TIME, floorStatus:'active', completedColors:[],
        leaderUid:''/*preserved*/, leaderName:'', memberCount:0 },{merge:true});
    // 팀장 정보 복원
    const snapA=await getDoc(TEAM_REF('A')); const snapB=await getDoc(TEAM_REF('B'));
    // Re-read player collection to get leader info
    const pSnap=await getDocs(PLAYERS);
    let lA={uid:'',name:''}, lB={uid:'',name:''};
    pSnap.forEach(d=>{
        const p=d.data();
        if(p.isLeader&&p.team==='A') lA={uid:d.id,name:p.name};
        if(p.isLeader&&p.team==='B') lB={uid:d.id,name:p.name};
    });
    await updateDoc(TEAM_REF('A'),{leaderUid:lA.uid,leaderName:lA.name});
    await updateDoc(TEAM_REF('B'),{leaderUid:lB.uid,leaderName:lB.name});
    await setDoc(STATE_REF,{gameStatus:'playing',confusionLevel:0,winner:null});
};

window.replayGame = async function() {
    const bpA=generateBlueprint(), bpB=generateBlueprint();
    const now=Date.now();
    const batch=writeBatch(db);
    batch.set(TEAM_REF('A'),{ floor:1, blueprint:bpA, timerEnd:now+FLOOR_TIME,
        floorStatus:'active', completedColors:[], leaderUid:'', leaderName:'', memberCount:0 },{merge:true});
    batch.set(TEAM_REF('B'),{ floor:1, blueprint:bpB, timerEnd:now+FLOOR_TIME,
        floorStatus:'active', completedColors:[], leaderUid:'', leaderName:'', memberCount:0 },{merge:true});
    await batch.commit();
    // 팀장 정보 복원
    const pSnap=await getDocs(PLAYERS);
    let lA={uid:'',name:''}, lB={uid:'',name:''};
    pSnap.forEach(d=>{ const p=d.data();
        if(p.isLeader&&p.team==='A') lA={uid:d.id,name:p.name};
        if(p.isLeader&&p.team==='B') lB={uid:d.id,name:p.name};
    });
    await updateDoc(TEAM_REF('A'),{leaderUid:lA.uid,leaderName:lA.name});
    await updateDoc(TEAM_REF('B'),{leaderUid:lB.uid,leaderName:lB.name});
    await setDoc(STATE_REF,{gameStatus:'playing',confusionLevel:0,winner:null});
};

window.resetGame = async function() {
    if(!confirm('모든 플레이어를 퇴장시키고 초기화합니다.')) return;
    await setDoc(STATE_REF,{gameStatus:'reset',confusionLevel:0,winner:null});
    setTimeout(async()=>{
        const pSnap=await getDocs(PLAYERS);
        const batch=writeBatch(db); pSnap.forEach(d=>batch.delete(d.ref)); await batch.commit();
        // 채팅 삭제
        for(const t of['A','B']){
            const cSnap=await getDocs(CHAT_COL(t));
            const b2=writeBatch(db); cSnap.forEach(d=>b2.delete(d.ref)); await b2.commit();
        }
        await setDoc(STATE_REF,{gameStatus:'lobby',confusionLevel:0,winner:null});
        await setDoc(TEAM_REF('A'),{floor:0,blueprint:[],timerEnd:0,floorStatus:'waiting',completedColors:[],leaderUid:'',leaderName:'',memberCount:0});
        await setDoc(TEAM_REF('B'),{floor:0,blueprint:[],timerEnd:0,floorStatus:'waiting',completedColors:[],leaderUid:'',leaderName:'',memberCount:0});
    },800);
};

async function joinGame() {
    const name=document.getElementById('name-input').value.trim();
    if(!name){ document.getElementById('name-input').focus(); return; }
    if(!selectedTeam){ alert('팀을 선택해주세요!'); return; }
    myName=name; myTeam=selectedTeam;

    // 팀의 첫 입장자인지 확인 → 팀장 결정
    const teamSnap=await getDoc(TEAM_REF(myTeam));
    const td=teamSnap.data();
    const isFirstInTeam=!td||!td.leaderUid;
    myRole=isFirstInTeam?'leader':'member';

    // Firestore에 플레이어 등록
    await setDoc(PLAYER_REF(myUid),{ name:myName, team:myTeam, isLeader:myRole==='leader', joinedAt:Date.now() });

    // 팀 문서에 팀장 / 멤버 수 업데이트
    if(myRole==='leader'){
        await setDoc(TEAM_REF(myTeam),{ leaderUid:myUid, leaderName:myName, memberCount:1 },{merge:true});
    } else {
        const currentCount=td?.memberCount||1;
        await updateDoc(TEAM_REF(myTeam),{ memberCount:currentCount+1 });
    }

    hasJoined=true;

    // 로비 화면
    const badge=document.getElementById('lobby-team-badge');
    badge.textContent=myTeam==='A'?'🔵 팀 A':'🔴 팀 B';
    badge.style.background=myTeam==='A'?'rgba(59,130,246,0.2)':'rgba(239,68,68,0.2)';
    badge.style.border=`2px solid ${myTeam==='A'?'#3b82f6':'#ef4444'}`;
    badge.style.color=myTeam==='A'?'#93c5fd':'#fca5a5';
    document.getElementById('lobby-role').textContent=myRole==='leader'?'👑 당신은 팀장입니다':'당신은 팀원입니다';
    showScreen('lobby-screen');
    setupListeners();
}

// ── 인증 ──────────────────────────────────────────────
try { await signInAnonymously(auth); myUid=auth.currentUser.uid; } catch(e){ console.error(e); }
</script>
